<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>시니어안심살핌 (senior-caresafe) | WellRiskKeeper</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- 공통 및 OSMU 3단 반응형 스타일 (게이트키퍼 표준 규격) -->
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/sgds.css">
  <link rel="stylesheet" href="./css/mobile.css">
  <link rel="stylesheet" href="./css/tablet.css">
  <link rel="stylesheet" href="./css/desktop.css">
</head>
<body>

  <!-- 게이트키퍼 스타일 상단 글로벌 네비게이션 바 -->
  <header class="top-nav">
    <div class="top-nav-inner">
      <div class="brand-group">
        <span class="brand-badge">시니어안심</span>
        <span class="brand-title">시니어안심살핌</span>
      </div>
    </div>
  </header>

  <!-- 메인 앱 컨테이너 -->
  <main class="app-wrapper">
    <!-- 게이트키퍼 표준 프로그레시브 스텝 탭 -->
    <nav class="pwa-step-tabs">
      <button type="button" class="pwa-tab-item active" data-tab="1">
        <span class="tab-num-badge">1</span><span class="tab-label">기관설정</span>
      </button>
      <button type="button" class="pwa-tab-item upcoming" data-tab="2">
        <span class="tab-num-badge">2</span><span class="tab-label">대상자</span>
      </button>
      <button type="button" class="pwa-tab-item upcoming" data-tab="3">
        <span class="tab-num-badge">3</span><span class="tab-label">업무선택</span>
      </button>
    </nav>

    <!-- 1단계: 기관 및 활동 세션 설정 -->
    <section id="step1Container" class="page-container active"></section>

    <!-- 2단계: 대상자 확인 -->
    <section id="step2Container" class="page-container"></section>

    <!-- 3단계: 현장 업무 선택 (1. S-GDS 우울검사 / 2. 고독사예방 게이트키퍼) -->
    <section id="step3Container" class="page-container"></section>
  </main>

  <!-- ESM 모듈 진입점 -->
  <script type="module" src="./js/app.js"></script>

</body>
</html>
