<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>시니어안심살핌 (senior-caresafe)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: #2563eb;
      font-weight: 600;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 10px 16px;
      border-radius: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #2563eb;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">현장 모바일 PWA</div>
    <h1>시니어안심살핌 (senior-caresafe)</h1>
    <p>고독사 예방 및 노인맞춤돌봄 현장 활동가를 위한 모바일 현장 업무 지원 플랫폼입니다.</p>
    <div class="status">
      <div class="dot"></div>
      <span>Cloudflare Pages 정상 연동 완료</span>
    </div>
  </div>
</body>
</html>
